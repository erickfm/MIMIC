# bc-S-v1 at Muon LR 0.01 (2026-10-29): 0.01 tied 0.02 at S (301-275, 52.3%, 3 h2h seeds) and beat it at M
# (57.6%), so S and M share one LR (owner). Otherwise identical to bc-S-v1.
tag: bc2
stage: bc
scale: S
data: fox-hf-647
steps: 56000
eff_batch: 768
max_local_batch: 768        # per-GPU batch cap; grad accumulation makes up the rest
export: last                # policy = the final step checkpoint (no averaging)
args:
  model: S
  encoder: mimic_flat
  stick-clusters: hal37
  mimic-controller-encoding: true
  self-inputs: true
  reaction-delay: 0
  cond-heads: true
  optimizer: muon
  muon-lr: 0.01
  lr: 3.0e-4
  cosine-min-lr: 1.0e-6
  no-warmup: true
  weight-decay: 0.01
  grad-clip-norm: 1.0
  dropout: 0.2
  val-frac: 0.025
  lean-metrics: true
