# rl-v3 at lr 2e-5 for 200 updates (2026-11-16, the best-known settings; docs/research-notes-2026-11-09.md).
# Fox S, 2 training seeds: ~1.1 logits above rl-v3's lr 1e-5 x 100, equal to lr 1e-5 x 400 at half the
# updates; lr 4e-5 x 200 no better; u400 at 2e-5 adds only ~0.15 logits. Fox M: beat fox-master 279-105.
# S ~165 min, M ~300 min on the 4090.
tag: rl4
stage: rl
templates: replays_doc_rt
args:
  vr: "stock_delta:1,damage_delta:1"
  updates: 200
  frames-per-update: 16384
  ppo-epochs: 4
  lr: 2.0e-5
  kl-beta: 0.0
  global-kl-beta: 0.01
  envs: 64
  workers: 16
  ppo-amp: true
  compile-learner: true
