# rl-v2 plus two speed settings (2026-11-09): bf16 PPO update (--ppo-amp) and the learner's rollout
# forward compiled (--compile-learner). Same math otherwise. Fox S, same parent and seed: 82 vs 104 min,
# 96-96 vs the rl-v2 run (docs/research-notes-2026-11-09.md).
tag: rl3
stage: rl
templates: replays_doc_rt
args:
  vr: "stock_delta:1,damage_delta:1"
  updates: 100
  frames-per-update: 16384
  ppo-epochs: 4
  lr: 1.0e-5
  kl-beta: 0.0
  global-kl-beta: 0.01
  envs: 64
  workers: 16
  ppo-amp: true
  compile-learner: true
